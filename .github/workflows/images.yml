name: images

# Build + push linux/amd64 images to GHCR (D-016: built here, pulled by Coolify — nothing builds on the server).
# Trigger: manual only (the lead enables push-to-main at deploy time). Tags are immutable `sha-<short>`; never `latest`
# (deploy-runbook §3/§11). The `api` image also runs card + keeper (SERVICE=api|card|keeper, one image, D-013).
on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Which images to build"
        type: choice
        default: all
        options: [all, api, web, indexer]

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            file: services/Dockerfile
            context: .
          - app: web
            file: apps/web/Dockerfile
            context: .
          # Envio indexer: its own pnpm project outside the workspace, so its build context is indexer/ (S8.3).
          - app: indexer
            file: indexer/Dockerfile
            context: indexer
    steps:
      - name: Skip unselected
        id: pick
        run: echo "run=${{ inputs.apps == 'all' || inputs.apps == matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: steps.pick.outputs.run == 'true'
      - name: Short SHA
        if: steps.pick.outputs.run == 'true'
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        if: steps.pick.outputs.run == 'true'
      - uses: docker/login-action@v4
        if: steps.pick.outputs.run == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: steps.pick.outputs.run == 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/blockchain-oracle/senryo-${{ matrix.app }}:sha-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/Blockchain-Oracle/senryo
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

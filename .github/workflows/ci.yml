name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: fast gate (typecheck · lint · invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm invariants
      - run: pnpm typecheck

  contracts:
    name: contracts (build · fmt · lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: forge build
        working-directory: contracts
        run: forge build
      - name: forge fmt
        working-directory: contracts
        run: if [ -n "$(ls src)" ]; then forge fmt --check; fi
      - name: forge lint
        working-directory: contracts
        run: forge lint

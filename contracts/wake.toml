[compiler.solc]
exclude_paths = ["test", "script", "venv", ".venv", "lib", "node_modules"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]
evm_version = "osaka"
via_IR = true
target_version = "0.8.31"

[compiler.solc.optimizer]
enabled = true
runs = 200

[compiler.solc.metadata]
append_CBOR = true
use_literal_content = true
bytecode_hash = "ipfs"

[detectors]
exclude = []
ignore_paths = ["test", "venv", ".venv"]
exclude_paths = ["test", "script", "venv", ".venv", "lib", "node_modules"]

[testing]
cmd = "anvil"

[testing.anvil]
cmd_args = "--prune-history 100 --transaction-block-keeper 10 --steps-tracing --silent"

[testing.ganache]
cmd_args = "-k istanbul -q"

[testing.hardhat]
cmd_args = ""
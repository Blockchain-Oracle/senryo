# senryo-web — nginx for the Next static export on the rpId host (D-011; runbook §6).
# The apex serves the passkey association files: they must be 200, application/json, and never redirect
# (Apple fetches through its CDN; Google Digital Asset Links through its API). `absolute_redirect off` and no `$uri/`
# in try_files keep every response a direct 200 — a redirect on these two paths breaks passkeys on the apps.
server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  server_tokens off;
  charset utf-8;

  # Liveness only (runbook §7); the image HEALTHCHECK probes it.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }

  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }

  # Hashed build assets never change.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # trailingSlash export (D-063): /portfolio/ → portfolio/index.html, without a slash redirect.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "publickey-credentials-get=(self), publickey-credentials-create=(self), camera=(self), microphone=(), geolocation=()" always;
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;
}

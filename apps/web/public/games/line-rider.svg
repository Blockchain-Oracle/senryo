<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
  <title>Line Rider: a sled on the price line</title>
  <style>
    .scroll{animation:scroll 6s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-360px)}}
    .sled{animation:bob 1.6s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(-16px) rotate(-4deg)}}
    .sp{animation:spark .9s ease-out infinite}.sp1{animation-delay:.3s}.sp2{animation-delay:.6s}
    @keyframes spark{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(-28px,10px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs><radialGradient id="g" cx="50%" cy="0%" r="90%"><stop offset="0%" stop-color="#241E14"/><stop offset="100%" stop-color="#0B0906"/></radialGradient></defs>
  <rect width="320" height="180" fill="url(#g)"/>
  <g class="scroll">
    <path d="M0,120 L40,112 L80,118 L120,98 L160,104 L200,86 L240,92 L280,110 L320,102 L360,120 L400,128 L440,112 L480,118 L520,100 L560,108 L600,120 L640,112 L680,118 L680,180 L0,180 Z" fill="#B5F543" opacity=".06"/>
    <path d="M0,120 L40,112 L80,118 L120,98 L160,104 L200,86 L240,92 L280,110 L320,102 L360,120 L400,128 L440,112 L480,118 L520,100 L560,108 L600,120 L640,112 L680,118" fill="none" stroke="#B5F543" stroke-width="8" stroke-opacity=".18"/>
    <path d="M0,120 L40,112 L80,118 L120,98 L160,104 L200,86 L240,92 L280,110 L320,102 L360,120 L400,128 L440,112 L480,118 L520,100 L560,108 L600,120 L640,112 L680,118" fill="none" stroke="#B5F543" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="sled"><rect x="92" y="84" width="34" height="6" rx="3" fill="#F5EFE0"/><circle cx="109" cy="74" r="7" fill="#FA00FF"/><path d="M86 92 Q96 98 132 92" stroke="#D4AE5B" stroke-width="2" fill="none"/></g>
  <circle class="sp" cx="88" cy="92" r="2" fill="#B5F543"/><circle class="sp sp1" cx="88" cy="92" r="2" fill="#B5F543"/><circle class="sp sp2" cx="88" cy="92" r="2" fill="#B5F543"/>
</svg>

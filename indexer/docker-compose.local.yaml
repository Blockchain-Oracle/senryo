# Local only — never deployed (Coolify publishes no host ports). Adds loopback ports for a compose smoke run:
#   docker compose -f docker-compose.yaml -f docker-compose.local.yaml --env-file <gitignored env> up --build
services:
  graphql-engine:
    ports:
      - "127.0.0.1:${HASURA_LOCAL_PORT:-8080}:8080"
  envio-indexer:
    ports:
      - "127.0.0.1:${INDEXER_LOCAL_PORT:-9898}:9898"

# Senryo indexer schema (Envio HyperIndex V3). Every row is per chain (disable_default_cross_chain), so ids only need
# to be unique within a chain. Units: money usd6 (1e6 = $1; Perpl CNS is the same scale), prices and sizes 1e18.
# Perpl prices/lots are normalised to 1e18 using the market's decimals. Counts are Int; all money is BigInt.

enum Venue {
  OURS
  PERPL
}
enum Side {
  LONG
  SHORT
}
enum PositionStatus {
  OPEN
  CLOSED
  LIQUIDATED
}
enum FillKind {
  OPEN
  INCREASE
  DECREASE
  CLOSE
  LIQUIDATE
  TRIGGER
  INVERT
  DELEVERAGE
}
enum DepositSource {
  DIRECT
  AURORA
  INBOX
  VOUCHER
}
enum MoveKind {
  DEPOSIT
  WITHDRAW
  SWAP_IN
  SWAP_OUT
  INBOX_ARRIVED
  PERPL_DEPOSIT
  PERPL_WITHDRAW
}
enum HoldStatus {
  OPEN
  CAPTURED
  RELEASED
}
enum ReleaseReason {
  OPERATOR
  EXPIRED
  RELEASE_ONLY
  CAPTURE_REMAINDER
}
enum TriggerStatus {
  PLACED
  CANCELLED
  EXECUTED
}
enum MarketStatus {
  OPEN
  REOPENING
  CLOSED
  STALE
  CIRCUIT
  HALTED
}
enum OracleEventKind {
  STATUS_CHANGED
  PRICE_REJECTED
  FEED_SET
  HALTED
  UNHALTED
  PROTOCOL_PAUSED
  SETTLE_ONLY
  AGGREGATOR_ADDED
}
enum IntentStatus {
  EXECUTED
  SKIPPED
}
enum ActivityKind {
  TRADE
  DEPOSIT
  WITHDRAW
  SWAP
  INBOX_ARRIVED
  CARD_HOLD
  CARD_HOLD_INCREASED
  CARD_CAPTURE
  CARD_RELEASE
  CARD_REFUND
  CARD_DEBT_REPAID
  CARD_ALLOWANCE
  CARD_ENVELOPE
  TRIGGER_PLACED
  TRIGGER_CANCELLED
  TRIGGER_EXECUTED
  LIQUIDATION
  LP_DEPOSIT
  LP_REDEEM_REQUESTED
  LP_REDEEMED
  VOUCHER
  STARTER
  INTENT_EXECUTED
  INTENT_SKIPPED
  PERPL_DEPOSIT
  PERPL_WITHDRAW
}

"""
An app user (the Mera account address). Latest AccountRiskUpdated snapshot plus cumulative stats across both venues.
"""
type User {
  id: ID!
  createdAt: Int!
  createdBlock: Int!
  lastActiveAt: Int! @index
  "Latest AccountRiskUpdated (usd6; equity and free amounts are signed)"
  riskNonce: BigInt!
  equityInit: BigInt!
  imTotal: BigInt!
  mmTotal: BigInt!
  holds: BigInt!
  cardDebt: BigInt!
  envelope: BigInt!
  freeToTrade: BigInt!
  freeToSpend: BigInt!
  riskUpdatedAt: Int
  riskBlock: Int
  "Cumulative, usd6"
  deposited: BigInt!
  withdrawn: BigInt!
  realizedPnl: BigInt!
  feesPaid: BigInt!
  "Signed: positive = paid by the user"
  fundingPaid: BigInt!
  borrowPaid: BigInt!
  volume: BigInt!
  cardSpent: BigInt!
  cardRefunded: BigInt!
  "Latest Perpl account balance (usd6)"
  perplCollateral: BigInt!
  tradeCount: Int!
  liquidationCount: Int!
  openPositions: Int!
  vouchersRedeemed: Int!
  firstDepositAt: Int
  firstTradeAt: Int
  perplAccount: PerplAccount
  balances: [CollateralBalance!]! @derivedFrom(field: "user")
  positions: [Position!]! @derivedFrom(field: "user")
  fills: [Fill!]! @derivedFrom(field: "user")
  activity: [Activity!]! @derivedFrom(field: "user")
  moves: [CollateralMove!]! @derivedFrom(field: "user")
  holdsList: [CardHold!]! @derivedFrom(field: "user")
  triggers: [Trigger!]! @derivedFrom(field: "user")
  liquidations: [Liquidation!]! @derivedFrom(field: "user")
  daily: [UserDailyStats!]! @derivedFrom(field: "user")
  riskHistory: [RiskSnapshot!]! @derivedFrom(field: "user")
}

"""
One collateral slot of a user's SenryoCore account (AUSD or USDC). `balance` is read from the chain at `balanceBlock`
(archive eth_call via an Effect); the flow totals are summed from events.
"""
type CollateralBalance {
  id: ID!
  user: User!
  symbol: String!
  token: String!
  balance: BigInt
  balanceBlock: Int
  deposited: BigInt!
  withdrawn: BigInt!
  swappedIn: BigInt!
  swappedOut: BigInt!
}

"A money movement of one user (ledger, inbox, Perpl collateral)."
type CollateralMove {
  id: ID!
  user: User!
  kind: MoveKind!
  token: String
  symbol: String
  amount: BigInt!
  counterparty: String
  source: DepositSource
  timestamp: Int! @index
  block: Int!
  txHash: String!
}

"The user's current rows of a unified activity feed (one query per screen)."
type Activity @index(fields: ["user", ["timestamp", "DESC"]]) {
  id: ID!
  user: User!
  kind: ActivityKind!
  timestamp: Int!
  block: Int!
  txHash: String!
  "usd6: TRADE = notional; money kinds = signed change of the user's balance; LP = assets"
  amount: BigInt
  symbol: String
  market: Market
  fill: Fill
  move: CollateralMove
  hold: CardHold
  trigger: Trigger
  liquidation: Liquidation
}

"Account risk history (one row per AccountRiskUpdated) — the equity chart and keeper scans."
type RiskSnapshot @index(fields: ["user", ["timestamp", "DESC"]]) {
  id: ID!
  user: User!
  nonce: BigInt!
  equityInit: BigInt!
  imTotal: BigInt!
  mmTotal: BigInt!
  freeToTrade: BigInt!
  freeToSpend: BigInt!
  holds: BigInt!
  cardDebt: BigInt!
  timestamp: Int!
  block: Int!
}

type Market {
  id: ID!
  venue: Venue!
  "Our uint8 marketId or the Perpl perpId"
  marketIndex: BigInt!
  symbol: String!
  name: String!
  enabled: Boolean!
  status: MarketStatus!
  statusSince: Int
  "1e18; ours = last accepted oracle price, Perpl = last observed fill price"
  lastPrice: BigInt
  lastPriceAt: Int
  priceDecimals: Int!
  lotDecimals: Int!
  "1e18 units; ours = whole market (MarketStateUpdated); Perpl = not tracked (0), read Perpl's API"
  longSize: BigInt!
  shortSize: BigInt!
  fundingIndex: BigInt!
  borrowIndex: BigInt!
  "1e18 per second (ours) / Perpl actualRatePct100k"
  fundingRate: BigInt!
  borrowRate: BigInt!
  "Notional usd6: ours = every trade, Perpl = every taker fill since APP_LAUNCH_BLOCK"
  volume: BigInt!
  tradeCount: Int!
  appVolume: BigInt!
  appTradeCount: Int!
  feed: OracleFeed
  positions: [Position!]! @derivedFrom(field: "market")
  fills: [Fill!]! @derivedFrom(field: "market")
  fundingRates: [FundingRate!]! @derivedFrom(field: "market")
  daily: [MarketDailyStats!]! @derivedFrom(field: "market")
}

"A position lifecycle (open → closed/liquidated); a reopen creates a new row."
type Position @index(fields: ["user", "status"]) {
  id: ID!
  user: User!
  market: Market!
  venue: Venue!
  side: Side!
  status: PositionStatus! @index
  "1e18 units and 1e18 USD"
  size: BigInt!
  entryPrice: BigInt!
  "usd6 posted margin (Perpl deposit; ours has cross margin → 0)"
  margin: BigInt!
  "usd6"
  realizedPnl: BigInt!
  feesPaid: BigInt!
  fundingPaid: BigInt!
  borrowPaid: BigInt!
  openedAt: Int!
  openedBlock: Int!
  updatedAt: Int! @index
  closedAt: Int
  perplAccount: PerplAccount
  fills: [Fill!]! @derivedFrom(field: "position")
}

type Fill @index(fields: ["user", ["timestamp", "DESC"]]) {
  id: ID!
  user: User!
  market: Market!
  position: Position!
  venue: Venue!
  kind: FillKind!
  side: Side!
  "1e18"
  size: BigInt!
  price: BigInt
  oraclePrice: BigInt
  "usd6"
  notional: BigInt!
  fee: BigInt!
  realizedPnl: BigInt!
  funding: BigInt!
  borrow: BigInt!
  isMaker: Boolean
  builderId: BigInt
  timestamp: Int!
  block: Int!
  txHash: String!
}

"Per-settlement funding/borrow paid or received (usd6, positive = paid)."
type FundingAccrual @index(fields: ["user", ["timestamp", "DESC"]]) {
  id: ID!
  user: User!
  market: Market!
  position: Position!
  funding: BigInt!
  borrow: BigInt!
  timestamp: Int!
  block: Int!
}

"Market-level funding point: ours from MarketStateUpdated, Perpl from FundingEventCompleted."
type FundingRate @index(fields: ["market", ["timestamp", "DESC"]]) {
  id: ID!
  market: Market!
  fundingRate: BigInt!
  borrowRate: BigInt!
  fundingIndex: BigInt!
  timestamp: Int!
  block: Int!
}

type Trigger {
  id: ID!
  user: User!
  market: Market!
  takeProfit: Boolean!
  "1e18"
  triggerPrice: BigInt!
  size: BigInt!
  expiry: Int!
  status: TriggerStatus! @index
  placedAt: Int!
  closedAt: Int
  keeper: String
  executedSize: BigInt
  txHash: String!
}

type Liquidation @index(fields: ["user", ["timestamp", "DESC"]]) {
  id: ID!
  user: User!
  venue: Venue!
  market: Market
  liquidator: String
  "usd6"
  penalty: BigInt!
  liquidatorFee: BigInt!
  shortfall: BigInt!
  insuranceCovered: BigInt!
  socialized: BigInt!
  realizedPnl: BigInt!
  positionsClosed: Int!
  "1e18 (Perpl)"
  markPrice: BigInt
  liqPrice: BigInt
  timestamp: Int!
  block: Int!
  txHash: String!
}

type CardHold @index(fields: ["user", "status"]) {
  id: ID!
  user: User!
  "usd6 current hold"
  amount: BigInt!
  placedAmount: BigInt!
  captured: BigInt!
  released: BigInt!
  debtCreated: BigInt!
  expiry: Int!
  fromEnvelope: Boolean!
  status: HoldStatus! @index
  releaseReason: ReleaseReason
  placedAt: Int!
  settledAt: Int
  txHash: String!
}

type CardRefund {
  id: ID!
  user: User!
  amount: BigInt!
  debtRepaid: BigInt!
  timestamp: Int!
  txHash: String!
}

"Card debt of one user (usd6)."
type CardDebt {
  id: ID!
  user: User!
  outstanding: BigInt!
  created: BigInt!
  repaid: BigInt!
  coveredByInsurance: BigInt!
  updatedAt: Int!
}

"The live user-signed spend allowance (D-032)."
type Allowance {
  id: ID!
  user: User!
  dailyLimit: BigInt!
  expiry: Int!
  nonce: BigInt!
  setAt: Int!
}

type Voucher {
  id: ID!
  user: User!
  amount: BigInt!
  redeemedAt: Int!
  txHash: String!
}

type StarterClaim {
  id: ID!
  user: User!
  nativeAmount: BigInt!
  practiceAmount: BigInt!
  claimedAt: Int!
  txHash: String!
}

"A per-user CREATE2 deposit inbox (\"Monad\" deposit family)."
type Inbox {
  id: ID!
  user: User!
  deployedAt: Int!
  "usd6 arrived and not yet swept"
  pending: BigInt!
  received: BigInt!
  swept: BigInt!
  transferCount: Int!
}

type IntentOrder {
  id: ID!
  user: User!
  market: Market
  status: IntentStatus!
  notional: BigInt
  reason: String
  timestamp: Int!
  txHash: String!
}

type LpPosition {
  id: ID!
  owner: String!
  "wallet shares (escrowed redeems excluded)"
  shares: BigInt!
  pendingShares: BigInt!
  depositedAssets: BigInt!
  redeemedAssets: BigInt!
  firstAt: Int!
  updatedAt: Int!
}

type LpRedeemRequest {
  id: ID!
  owner: String!
  receiver: String!
  shares: BigInt!
  claimableAt: Int!
  assets: BigInt
  requestedAt: Int!
  redeemedAt: Int
}

type LpPoolDaily {
  id: ID!
  day: Int! @index
  deposits: BigInt!
  redeems: BigInt!
  sharesMinted: BigInt!
  sharesBurned: BigInt!
  "Σ trader fees and Σ trader realized PnL on our markets, usd6 (the pool is the counterparty; value = chain read)"
  traderFees: BigInt!
  traderPnl: BigInt!
}

"Asset price feed (XAU, XAG); rounds from Chainlink aggregators (mainnet) or MirrorAggregators (testnet)."
type OracleFeed {
  id: ID!
  symbol: String!
  decimals: Int!
  aggregator: String!
  latestRoundId: BigInt!
  latestAnswer: BigInt!
  "1e18"
  latestPrice: BigInt!
  latestUpdatedAt: Int!
  roundCount: Int!
  rounds: [OracleRound!]! @derivedFrom(field: "feed")
  candles: [Candle!]! @derivedFrom(field: "feed")
}

type OracleRound @index(fields: ["feed", ["updatedAt", "DESC"]]) {
  id: ID!
  feed: OracleFeed!
  aggregator: String!
  roundId: BigInt!
  answer: BigInt!
  price: BigInt!
  updatedAt: Int!
  block: Int!
  txHash: String!
}

"""
OHLC (1e18) per feed and interval, built only from real oracle rounds and our fills — an interval with neither has no
row (no fabricated ticks; the client draws the gap).
"""
type Candle @index(fields: ["feed", "interval", ["openTime", "DESC"]]) {
  id: ID!
  feed: OracleFeed!
  "seconds"
  interval: Int!
  openTime: Int!
  open: BigInt!
  high: BigInt!
  low: BigInt!
  close: BigInt!
  roundCount: Int!
  fillCount: Int!
  "usd6 notional of our fills"
  volume: BigInt!
  updatedAt: Int!
}

type OracleStatusEvent @index(fields: ["market", ["timestamp", "DESC"]]) {
  id: ID!
  market: Market
  kind: OracleEventKind!
  previous: MarketStatus
  current: MarketStatus
  "1e18"
  price: BigInt
  roundId: BigInt
  rejectedPrice: BigInt
  until: Int
  detail: String
  timestamp: Int!
  block: Int!
  txHash: String!
}

type PerplAccount {
  id: ID!
  owner: String! @index
  user: User
  "usd6; unknown until the first balance-bearing event after APP_LAUNCH_BLOCK"
  balance: BigInt
  createdAt: Int!
  deposited: BigInt!
  withdrawn: BigInt!
}

type UserDailyStats @index(fields: ["user", "day"]) {
  id: ID!
  user: User!
  day: Int!
  realizedPnl: BigInt!
  fees: BigInt!
  funding: BigInt!
  volume: BigInt!
  trades: Int!
  deposits: BigInt!
  withdrawals: BigInt!
  cardSpend: BigInt!
  "last equityInit of the day (usd6)"
  equity: BigInt
}

type MarketDailyStats @index(fields: ["market", "day"]) {
  id: ID!
  market: Market!
  day: Int!
  volume: BigInt!
  trades: Int!
  appVolume: BigInt!
  fees: BigInt!
  liquidations: Int!
  longSize: BigInt!
  shortSize: BigInt!
}

"Singleton per chain (id \"global\")."
type ProtocolStats {
  id: ID!
  users: Int!
  depositors: Int!
  traders: Int!
  deposits: BigInt!
  withdrawals: BigInt!
  volumeOurs: BigInt!
  volumePerplApp: BigInt!
  "every Perpl taker fill since APP_LAUNCH_BLOCK (third-party aggregate)"
  perplVolumeAll: BigInt!
  "Perpl taker fills carrying our builder id"
  builderVolume: BigInt!
  trades: Int!
  fees: BigInt!
  liquidations: Int!
  insuranceCovered: BigInt!
  socialized: BigInt!
  cardHoldsPlaced: Int!
  cardHeld: BigInt!
  cardSpent: BigInt!
  cardRefunded: BigInt!
  vouchersAdded: Int!
  vouchersRedeemed: Int!
  starterClaims: Int!
  lpShares: BigInt!
  lpDeposited: BigInt!
  lpRedeemed: BigInt!
  oracleRounds: Int!
  perplFillsAttributed: Int!
  "fills the Perpl cursor could not pair — alarm for an undocumented event-ordering change"
  unattributedFills: Int!
  pausedUntil: Int
  settleOnly: Boolean!
  updatedAt: Int!
}

type ProtocolDailyStats {
  id: ID!
  day: Int! @index
  newUsers: Int!
  activeUsers: Int!
  deposits: BigInt!
  withdrawals: BigInt!
  volume: BigInt!
  trades: Int!
  fees: BigInt!
  liquidations: Int!
  cardSpend: BigInt!
  cardHolds: Int!
  lpDeposits: BigInt!
  lpRedeems: BigInt!
}

"""
Tx-scoped scratch linking Perpl fill events to the preceding Position* event (taker fills carry no accountId).
Per chain, id "cursor". Hidden from GraphQL.
"""
type PerplCursor @internal {
  id: ID!
  txHash: String!
  logIndex: Int!
  accountId: String!
  marketId: String!
  "set only when the account belongs to an app user"
  fillId: String
}

"Current open position per (market, owner) — the lifecycle row a new fill updates."
type PositionPointer @internal {
  id: ID!
  positionId: String!
}

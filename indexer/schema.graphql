# Senryo indexer schema (S4, D-272). Ids are `<chainId>_<on-chain id>`; references are plain indexed fields (no
# @derivedFrom: Hasura is off and the api queries these tables over SQL). Money is in dollar base units (6 decimals),
# prices e-8.

"One catalogue series (market × cadence) as registered on chain."
type Market {
  id: ID!
  chainId: Int! @index
  seriesId: String! @index
  marketKey: String!
  cadenceSec: Int!
  calls: Int!
  volume: BigInt!
  paidOut: BigInt!
}

"A price window: its prints, verdict, and the calls in it (crowd split from bandStake)."
type Window {
  id: ID!
  chainId: Int! @index
  windowId: String! @index
  seriesId: String! @index
  start: Int! @index
  expiry: Int!
  state: String!
  voidReason: Int!
  openE8: BigInt
  closeE8: BigInt
  calls: Int!
  volume: BigInt!
  "Stake filled per band index (0 Up, 1 Down, 2 Range, 3 Moonshot, 4 Crash, …)."
  bandStake: [BigInt!]!
  settled: Boolean!
  wonMask: Int!
  refundMask: Int!
  lostMask: Int!
  toPool: BigInt!
  toHolders: BigInt!
  openedTx: String!
  resolvedTx: String
  settledTx: String
}

"A unique Pyth print recorded on chain (a window boundary or a fill instant)."
type Print {
  id: ID!
  chainId: Int! @index
  feedId: String! @index
  t: Int! @index
  priceE8: BigInt!
  confE8: BigInt!
  publishTime: Int!
  txHash: String!
}

"One call from commit to payout."
type Ticket {
  id: ID!
  chainId: Int! @index
  ticketId: BigInt! @index
  owner: String! @index
  windowId: String! @index
  band: Int!
  status: String! @index
  originalStake: BigInt!
  stake: BigInt!
  payout: BigInt!
  entryE8: BigInt
  probE6: Int
  priceE6: Int
  target: Int!
  viaSession: Boolean!
  committedAt: Int! @index
  committedTx: String!
  committedBy: String!
  filledAt: Int
  fillTx: String
  closedShares: BigInt!
  proceeds: BigInt!
  refunded: BigInt!
  paid: BigInt!
  outcome: String
  refuseReason: Int
  settledAt: Int
  claimTx: String
  "The standing exit (D-292), a share's bid × 1e6 (0 = unset)."
  exitTakeProfitE6: Int!
  exitStopLossE6: Int!
  exitFloorE6: Int!
  exitTrailE6: Int!
  "What fired the pending close: 1 take-profit or stop-loss, 2 the trail (null for the owner's own)."
  exitFiring: Int
  "take-profit · stop-loss · trail, when an exit sold the last shares."
  closedBy: String
  "A duel card (D-294): the match it was picked in. The arena owns it on chain; `owner` is the player."
  duelMatch: String
}

"A parlay (D-293): 2–4 legs that must all come true; legs are read from the chain by the api, outcomes here."
type Parlay {
  id: ID!
  chainId: Int! @index
  parlayId: BigInt! @index
  owner: String! @index
  status: String! @index
  stake: BigInt!
  payout: BigInt!
  chanceE6: Int
  "Each leg's outcome in leg order: pending · won · tied · lost · void."
  legOutcomes: [String!]!
  outcome: String
  returned: BigInt!
  viaSession: Boolean!
  committedAt: Int! @index
  committedTx: String!
  settledAt: Int
  settleTx: String
}

"A duel (D-294): two players, a sealed deck of three windows, one call per card each; the better total takes both pots."
type Duel {
  id: ID!
  chainId: Int! @index
  matchId: String! @index
  tier: Int!
  playerA: String! @index
  playerB: String! @index
  pot: BigInt!
  cardStake: BigInt!
  "sealed · picking · settling · forfeited · refunded · finalized"
  state: String! @index
  deckHash: String!
  "The three card windows and the server's seed, once revealed (the commitment can be re-checked)."
  cards: [String!]!
  serverSeed: String
  pickDeadline: Int
  forfeitedBy: String
  winner: String
  resultA: BigInt!
  resultB: BigInt!
  "Each player's rating change when the pot was decided."
  ratingDeltaA: Int
  ratingDeltaB: Int
  openedAt: Int! @index
  openTx: String!
  revealTx: String
  finishedAt: Int
  finishTx: String
}

"A player's call on one duel card: the reserve ticket and what it returned."
type DuelPick {
  id: ID!
  chainId: Int! @index
  matchId: String! @index
  player: String! @index
  card: Int!
  band: Int!
  ticketId: BigInt!
  returned: BigInt
  result: BigInt
  pickedAt: Int!
  pickTx: String!
}

"A player's duel rating on one network (Elo from 1000; K 48 for the first 10 duels, then 24)."
type DuelRating {
  id: ID!
  chainId: Int! @index
  owner: String! @index
  rating: Int! @index
  played: Int!
  wins: Int!
  losses: Int!
  ties: Int!
  updatedAt: Int!
}

"Everything that happened to a ticket, in order (the Calls timeline and receipts)."
type TicketEvent {
  id: ID!
  chainId: Int! @index
  ticketId: BigInt! @index
  owner: String! @index
  kind: String!
  amount: BigInt!
  priceE8: BigInt
  timestamp: Int! @index
  txHash: String!
}

"A caller's record on one network (Practice and Real are separate rows, D-270)."
type Account {
  id: ID!
  chainId: Int! @index
  owner: String! @index
  calls: Int!
  staked: BigInt!
  returned: BigInt!
  "Realised: returned − stake over finished tickets."
  pnl: BigInt! @index
  wins: Int!
  losses: Int!
  refunds: Int!
  streak: Int!
  bestStreak: Int!
  lastActiveAt: Int! @index
}

type DailyAccountStat {
  id: ID!
  chainId: Int! @index
  owner: String! @index
  day: Int! @index
  calls: Int!
  "Tickets that finished as wins that day (the day/week boards)."
  wins: Int!
  staked: BigInt!
  pnl: BigInt! @index
}

"Earn's hourly roll (D-287): the pool's value and supply it settled at, and what came in and went out."
type PoolEpoch {
  id: ID!
  chainId: Int! @index
  hour: Int! @index
  value: BigInt!
  supply: BigInt!
  supplied: BigInt!
  withdrawn: BigInt!
  "The withdrawal batch waited for the next roll (the pool's liquid could not cover it)."
  deferred: Boolean!
  rolledTx: String!
}

"The shared pool on one network (house-funded until Earn, D-276)."
type Pool {
  id: ID!
  chainId: Int! @index
  funded: BigInt!
  defunded: BigInt!
  "Σ toPool − Σ reserve paid out to winners: the pool's realised result."
  settledToPool: BigInt!
  settledToHolders: BigInt!
  heldPayouts: BigInt!
}

type Session {
  id: ID!
  chainId: Int! @index
  owner: String! @index
  delegate: String!
  perCallCap: BigInt!
  sessionCap: BigInt!
  expiry: Int!
  epoch: Int!
  grantedTx: String!
}

"A yes/no question (D-296): listed by the keeper, answered by a named committee, Yes stakes against No stakes."
type EventMarket {
  id: ID!
  chainId: Int! @index
  eventId: String! @index
  committeeId: Int!
  question: String!
  rules: String!
  termsHash: String!
  feeBps: Int!
  closesAt: Int! @index
  answerFrom: Int!
  answerBy: Int!
  "open · decided · voided"
  state: String! @index
  "The committee's answer (true = Yes): once decided, or voided because nobody called it."
  answer: Boolean
  "disagreement · quorum · no-winners"
  voidReason: String
  yesPool: BigInt!
  noPool: BigInt!
  calls: Int!
  fee: BigInt
  prize: BigInt
  listedAt: Int!
  listedTx: String!
  decidedAt: Int
  decidedTx: String
}

"One committee member's signed answer on a question (the api keeps the statement; its hash is here)."
type EventAnswer {
  id: ID!
  chainId: Int! @index
  eventId: String! @index
  member: String! @index
  yes: Boolean!
  statementHash: String!
  attestedAt: Int!
  answeredTx: String!
}

"One call on a yes/no question, from its stake to its payout; it counts on its caller's record like any call."
type EventCall {
  id: ID!
  chainId: Int! @index
  ticketId: BigInt! @index
  eventId: String! @index
  owner: String! @index
  yes: Boolean!
  stake: BigInt!
  "open · won · lost · refunded"
  status: String! @index
  amount: BigInt
  calledAt: Int! @index
  callTx: String!
  paidAt: Int
  paidTx: String
}

"A committee as set on chain: its members (named in the log) and how many must agree. Never changed once set."
type EventCommittee {
  id: ID!
  chainId: Int! @index
  committeeId: Int!
  members: [String!]!
  names: [String!]!
  quorum: Int!
  enabled: Boolean!
}
